packages:
  # Needed from Phase 8 onwards:
  #   generate_surrogate_key  -> deterministic hash keys, so a rebuild does not
  #                              reassign keys and invalidate the fact table
  #   date_spine              -> builds dim_date without a source table
  #   equal_rowcount, etc.    -> extra tests for Phase 9
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

# Install with:   dbt deps
# Installed into: dbt_packages/   (gitignored; dbt deps restores it)

# Considered and left out for now: calogica/dbt_expectations. Useful for
# distribution tests, but dbt_utils plus the custom tests in Phase 9 cover
# everything this project needs, and a dependency that is not pulling its
# weight is just another thing to keep up to date.
