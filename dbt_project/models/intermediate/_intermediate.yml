version: 2

models:
  - name: int_customer_snapshot_input
    description: Ephemeral RAW projection for one replay date or the latest known customer state.
  - name: int_customer_history
    description: Customer versions with half-open validity intervals [valid_from, valid_to).
    columns:
      - name: customer_version_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
  - name: int_order_items_enriched
    description: >
      One row per item with order details, current product attributes and
      customer geography as of order time. Costs use the charged unit_cost,
      never the latest catalogue cost. Shipping is excluded from line revenue
      and margin. Defective records remain visible and are flagged.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: customer_version_id
        description: NULL when no captured historical version covers the order timestamp.
      - name: is_revenue_eligible
        description: Status-based eligibility only; invalid amounts or quantities are not repaired.
        data_tests: [not_null]
